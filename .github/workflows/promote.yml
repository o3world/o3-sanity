name: Promote to production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to promote (must be on main; defaults to main HEAD)'
        required: false

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      deployments: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: production
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Resolve SHA
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ inputs.sha }}"
          if [ -z "$SHA" ]; then
            SHA=$(gh api repos/${{ github.repository }}/branches/main --jq .commit.sha)
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
      - name: Refuse SHAs not on main
        run: |
          git branch -r --contains ${{ steps.sha.outputs.sha }} | grep -q "origin/main" || {
            echo "::error::${{ steps.sha.outputs.sha }} is not on main"; exit 1;
          }
      - uses: ./.github/actions/setup
      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest
      - name: Deploy Sanity schema (production)
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
        run: pnpm schema:deploy
      # Promote runs a hand-picked SHA, which may be older than main HEAD, so it
      # asserts the deploy landed rather than trusting the push run that built
      # that commit. Same token: this only reads what the step above wrote.
      - name: Verify Sanity schema (production)
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
        run: pnpm schema:check
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      # Production is the one build that prerenders every detail page. The
      # flag says so here rather than leaving it to `vercel build --prod` to
      # set VERCEL_ENV: this is the deploy visitors land on, and what it
      # prerenders should not depend on how the CLI names its environment.
      - name: Build
        env:
          O3_PRERENDER_ALL: '1'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Start GitHub deployment
        id: gh-deploy-start
        uses: ./.github/actions/gh-deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production-web
          ref: ${{ steps.sha.outputs.sha }}
          production_environment: 'true'
      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="release-$(date -u +%Y%m%d-%H%M)-$(echo ${{ steps.sha.outputs.sha }} | cut -c1-7)"
          gh release create "$TAG" --target ${{ steps.sha.outputs.sha }} --generate-notes --title "$TAG"
      - name: Finish GitHub deployment
        if: always()
        uses: ./.github/actions/gh-deployment
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production-web
          deployment_id: ${{ steps.gh-deploy-start.outputs.deployment_id }}
          status: ${{ job.status }}
          env_url: ${{ steps.deploy.outputs.url }}
