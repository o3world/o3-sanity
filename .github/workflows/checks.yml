name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: lint
          - task: typecheck
          - task: build
            filter: --filter=@o3/web
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      # PRs check only what changed relative to the base; pushes to main run full.
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Validate affected base
        if: env.TURBO_SCM_BASE != ''
        run: |
          if ! git merge-base "$TURBO_SCM_BASE" HEAD >/dev/null 2>&1; then
            echo "Base $TURBO_SCM_BASE unresolvable — falling back to a full run."
            echo "TURBO_SCM_BASE=" >> "$GITHUB_ENV"
          fi
      - name: Run ${{ matrix.task }}
        run: |
          if [ -n "$TURBO_SCM_BASE" ]; then
            pnpm turbo run ${{ matrix.task }} ${{ matrix.filter }} --affected
          else
            pnpm turbo run ${{ matrix.task }} ${{ matrix.filter }}
          fi

  # What the build says about how it renders (#265), what a bot probe costs
  # (#267), and how much JavaScript each route ships (#269). Its own job, after
  # the build it reads: `needs: checks` lets the build below come back from the
  # turbo cache the checks job filled, and builds for real when it cannot.
  # Either way what Next left in `.next` is the assertions' ground truth.
  #
  # Never gated on `--affected` — a change that flips a route to per-request
  # rendering, or adds half a megabyte to every page, can land anywhere in the
  # graph, and the whole point is that nobody has to work out which files
  # those are.
  build-assert:
    name: build assertions
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the site
        run: pnpm turbo run build --filter=@o3/web
      - name: Assert the rendering strategy, cached 404s and the JS budget
        run: pnpm build:assert

  # The three test layers (ADR 0004). Deliberately its own job rather than a
  # `turbo run` task: tests are a checkpoint, not something every command
  # drags along, and this keeps the browser layer's Chromium download off the
  # lint/typecheck/build path.
  #
  # Always runs the whole suite. An earlier version ran `--changed` against the
  # base on PRs to save time; it resolved to "No test files found, exiting with
  # code 0" and the job passed without running a single test. A check that
  # cannot fail is worse than no check. The full suite is ~5s of test time and
  # Chromium is cached, so there was nothing worth optimising here.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The suite never reaches Sanity — the render layer stubs the fetch seam
      # and the other two layers are offline by construction. These exist only
      # so module-level config validation has something to read, which is why
      # they are literals rather than secrets.
      NEXT_PUBLIC_SANITY_PROJECT_ID: test
      NEXT_PUBLIC_SANITY_DATASET: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm ls playwright --depth 0 --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].devDependencies.playwright.version))')" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run tests
        run: pnpm test

  sanity-typegen:
    name: typegen drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Regenerate Sanity types
        run: pnpm typegen
      - name: Fail on drift
        run: |
          if ! git diff --exit-code packages/sanity/src/types/generated.ts; then
            echo "::error::packages/sanity/src/types/generated.ts is stale — run 'pnpm typegen' and commit."
            exit 1
          fi

  # The o3sanity plugin is not a workspace package, so `turbo run lint` never
  # visits it. Its own job, on the typegen-drift shape.
  skill-lint:
    name: skill lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Validate the authoring skills
        run: pnpm skill:lint
