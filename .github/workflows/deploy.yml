name: Deploy web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: deploy-web-${{ github.ref }}
  # Pushes queue rather than cancel: each push gates on its own before..head
  # range, so cancelling push A when push B arrives would let B's narrower
  # range gate A's changes out of ever deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected:
    name: Gate on affected
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Decide
        id: gate
        uses: ./.github/actions/affected-gate
        with:
          filter: '@o3/web'

  deploy:
    name: Vercel deploy
    needs: affected
    if: needs.affected.outputs.deploy == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: production
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest
      - name: Deploy Sanity schema
        if: github.event_name == 'push'
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
        run: pnpm schema:deploy
      # The deploy above can exit 0 without the schema landing, or land it
      # against the wrong workspace or dataset, and nothing downstream notices —
      # field descriptions are what an authoring agent reads out of the dataset,
      # so a stale one answers confidently with the old design. This reads the
      # deployed manifest back and fails the job if it disagrees with the repo.
      # Same token: `schemas list` only reads what `schema deploy` just wrote.
      - name: Verify Sanity schema
        if: github.event_name == 'push'
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
        run: pnpm schema:check
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build
        env:
          O3_SPATIAL_GLOBE: '1'
          VERCEL_ENV: preview
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Start GitHub deployment
        id: gh-deploy-start
        uses: ./.github/actions/gh-deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: ${{ github.event_name == 'push' && 'staging-web' || 'preview-web' }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Deploy
        id: deploy
        run: |
          # --target=preview is explicit: vercel@58 in GitHub Actions has been
          # observed to default a root-cwd prebuilt deploy to production.
          URL=$(vercel deploy --prebuilt --archive=tgz --target=preview --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Alias branch
        id: alias
        uses: ./.github/actions/vercel-alias-branch
        with:
          deployment_url: ${{ steps.deploy.outputs.url }}
          project: o3-sanity-web
          branch: ${{ github.head_ref || github.ref_name }}
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
      # Smoke: the deployed site and its embedded studio must answer 200.
      # `vercel curl` rides the CI token through deployment protection — no
      # bypass secret to provision or rotate. Global flags (--scope) must come
      # BEFORE the path arg; anything after it is forwarded to real curl.
      - name: Smoke check
        run: |
          BASE="${{ steps.alias.outputs.alias_url || steps.deploy.outputs.url }}"
          for PATHNAME in / /studio; do
            CODE=$(vercel curl --scope o3-world "$PATHNAME" --deployment "$BASE" --yes -- \
              -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5)
            echo "$BASE$PATHNAME → $CODE"
            [ "$CODE" = "200" ] || exit 1
          done
      - name: Finish GitHub deployment
        if: always()
        uses: ./.github/actions/gh-deployment
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: ${{ github.event_name == 'push' && 'staging-web' || 'preview-web' }}
          deployment_id: ${{ steps.gh-deploy-start.outputs.deployment_id }}
          status: ${{ job.status }}
          env_url: ${{ steps.alias.outputs.alias_url || steps.deploy.outputs.url }}
