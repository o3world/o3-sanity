<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!--
    Engagement diagram 02 — Product Squad. Six nodes on a ring, every one of
    them spoked to the same centre, the whole assembly turning slowly.

    Carried over from `prototype/O3 Homepage v2.dc.html` (the `.eng-gfx` block
    at its line 2209). See `eng-embedded.svg` for why this file is
    self-contained and why the entry animations autoplay.
  -->
  <style>
    .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s cubic-bezier(.4,0,.2,1) forwards }
    .pop  { opacity: 0; transform: scale(0); animation: pop .55s cubic-bezier(.2,.9,.3,1.3) forwards }
    .red  { animation: pop .55s cubic-bezier(.2,.9,.3,1.3) forwards, pulse 3.4s ease-in-out 1.2s infinite }
    .rotate { transform-origin: 150px 150px; animation: spin 70s linear infinite }

    @keyframes draw  { to { stroke-dashoffset: 0 } }
    @keyframes pop   { to { opacity: 1; transform: scale(1) } }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .55 } }
    @keyframes spin  { to { transform: rotate(360deg) } }

    @media (prefers-reduced-motion: reduce) {
      .line { stroke-dashoffset: 0 }
      .pop, .red { opacity: 1; transform: none }
      .line, .pop, .red, .rotate { animation: none }
    }
  </style>

  <g class="rotate">
    <circle class="line" cx="150" cy="150" r="95" fill="none" stroke="#DDDDDB" stroke-width="1" pathLength="1"/>

    <line class="line" x1="150" y1="150" x2="150" y2="55" stroke="#EBEBE9" stroke-width="1" pathLength="1"/>
    <circle class="pop red" style="animation-delay:.3s;transform-origin:150px 55px" cx="150" cy="55" r="11" fill="#EB1000"/>

    <line class="line" x1="150" y1="150" x2="232.3" y2="102.5" stroke="#EBEBE9" stroke-width="1" pathLength="1"/>
    <circle class="pop" style="animation-delay:.39s;transform-origin:232.3px 102.5px" cx="232.3" cy="102.5" r="8" fill="#8A8A8E"/>

    <line class="line" x1="150" y1="150" x2="232.3" y2="197.5" stroke="#EBEBE9" stroke-width="1" pathLength="1"/>
    <circle class="pop" style="animation-delay:.48s;transform-origin:232.3px 197.5px" cx="232.3" cy="197.5" r="8" fill="#8A8A8E"/>

    <line class="line" x1="150" y1="150" x2="150" y2="245" stroke="#EBEBE9" stroke-width="1" pathLength="1"/>
    <circle class="pop" style="animation-delay:.57s;transform-origin:150px 245px" cx="150" cy="245" r="8" fill="#8A8A8E"/>

    <line class="line" x1="150" y1="150" x2="67.7" y2="197.5" stroke="#EBEBE9" stroke-width="1" pathLength="1"/>
    <circle class="pop" style="animation-delay:.66s;transform-origin:67.7px 197.5px" cx="67.7" cy="197.5" r="8" fill="#8A8A8E"/>

    <line class="line" x1="150" y1="150" x2="67.7" y2="102.5" stroke="#EBEBE9" stroke-width="1" pathLength="1"/>
    <circle class="pop" style="animation-delay:.75s;transform-origin:67.7px 102.5px" cx="67.7" cy="102.5" r="8" fill="#8A8A8E"/>
  </g>
</svg>
