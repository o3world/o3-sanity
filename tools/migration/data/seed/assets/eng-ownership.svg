<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!--
    Engagement diagram 03 — Full Ownership. Three concentric rings breathing
    out of phase around a brand-red core, with a counter-turning system of
    satellites: everything orbits the one thing we're accountable for.

    Carried over from `prototype/O3 Homepage v2.dc.html` (the `.eng-gfx` block
    at its line 2412). See `eng-embedded.svg` for why this file is
    self-contained and why the entry animations autoplay.

    The negative `animation-delay` on the inner two rings is what staggers the
    breath — it starts them partway through the cycle rather than delaying
    them, so no ring waits before its first frame.
  -->
  <style>
    .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s cubic-bezier(.4,0,.2,1) forwards }
    .pop  { opacity: 0; transform: scale(0); animation: pop .55s cubic-bezier(.2,.9,.3,1.3) forwards }
    .red  { animation: pop .55s cubic-bezier(.2,.9,.3,1.3) forwards, pulse 3.4s ease-in-out 1.2s infinite }
    .breathe { transform-origin: 150px 150px; animation: breathe 7.2s ease-in-out infinite }
    .rotate-slow { transform-origin: 150px 150px; animation: spin 120s linear infinite reverse }

    @keyframes draw    { to { stroke-dashoffset: 0 } }
    @keyframes pop     { to { opacity: 1; transform: scale(1) } }
    @keyframes pulse   { 0%, 100% { opacity: 1 } 50% { opacity: .55 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.045) } }
    @keyframes spin    { to { transform: rotate(360deg) } }

    @media (prefers-reduced-motion: reduce) {
      .line { stroke-dashoffset: 0 }
      .pop, .red { opacity: 1; transform: none }
      .line, .pop, .red, .breathe, .rotate-slow { animation: none }
    }
  </style>

  <g class="breathe" style="animation-delay:0s">
    <circle class="line" cx="150" cy="150" r="118" fill="none" stroke="#8A8A8E" stroke-width="1.4" pathLength="1"/>
  </g>
  <g class="breathe" style="animation-delay:-2.4s">
    <circle class="line" cx="150" cy="150" r="78" fill="none" stroke="#DDDDDB" stroke-width="1" pathLength="1"/>
  </g>
  <g class="breathe" style="animation-delay:-4.8s">
    <circle class="line" cx="150" cy="150" r="40" fill="none" stroke="#DDDDDB" stroke-width="1" pathLength="1"/>
  </g>

  <circle class="pop red" style="animation-delay:.35s;transform-origin:150px 150px" cx="150" cy="150" r="12" fill="#EB1000"/>

  <g class="rotate-slow">
    <circle class="pop" style="animation-delay:.45s;transform-origin:150px 72px" cx="150" cy="72" r="7" fill="#8A8A8E"/>
    <circle class="pop" style="animation-delay:.53s;transform-origin:217px 189px" cx="217" cy="189" r="7" fill="#8A8A8E"/>
    <circle class="pop" style="animation-delay:.61s;transform-origin:83px 189px" cx="83" cy="189" r="7" fill="#8A8A8E"/>
    <circle class="pop" style="animation-delay:.69s;transform-origin:150px 110px" cx="150" cy="110" r="5" fill="#C8C8CC"/>
    <circle class="pop" style="animation-delay:.77s;transform-origin:185px 170px" cx="185" cy="170" r="5" fill="#C8C8CC"/>
    <circle class="pop" style="animation-delay:.85s;transform-origin:115px 170px" cx="115" cy="170" r="5" fill="#C8C8CC"/>
  </g>
</svg>
