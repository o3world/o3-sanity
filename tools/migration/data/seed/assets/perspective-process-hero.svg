<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    Perspective hero, "A map, a queue, and one worktree per ticket".

    The post's spine drawn once: work resolved on the left, the frontier as a
    single red column, fog to the right. Squares because the design has square
    corners everywhere; the red arrives as a gradient because a flat red area
    is almost always wrong in this design (see tokens/color.css).

    Self-contained on purpose. An SVG referenced by <img> cannot see the page
    stylesheet and never runs script, so the palette and the motion live here.
    Token values used: ink #0A0A0A, ink-deep #030303, brand #EB1000,
    fg-muted #636363, line #DDDDDB.

    (No double hyphen anywhere in this file: XML forbids one inside a comment,
    and an SVG that fails to parse renders as a 0x0 broken image.)
  -->
  <defs>
    <linearGradient id="brandGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6A5A"/>
      <stop offset="100%" stop-color="#EB1000"/>
    </linearGradient>
    <linearGradient id="fogWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#030303" stop-opacity="0"/>
      <stop offset="65%" stop-color="#030303" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <style>
    .settled { opacity: 0; animation: rise .5s cubic-bezier(.2,.9,.3,1) forwards }
    .edge    { opacity: 0; animation: rise .5s cubic-bezier(.2,.9,.3,1) forwards, breathe 4.2s ease-in-out 1.6s infinite }
    .fog     { opacity: 0; animation: rise .5s ease-out forwards }
    .sweep   { animation: sweep 9s cubic-bezier(.45,0,.55,1) infinite }

    @keyframes rise    { to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { opacity: 1 } 50% { opacity: .6 } }
    @keyframes sweep   { 0%, 12% { transform: translateX(0) } 55%, 100% { transform: translateX(44px) } }

    /* The arrangement is the information; the motion is the flourish. */
    @media (prefers-reduced-motion: reduce) {
      .settled, .edge, .fog { opacity: 1; animation: none }
      .sweep { animation: none }
    }
  </style>

  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Eight columns of twelve. Columns 1 to 4 are resolved, column 5 is the
       frontier, columns 6 to 8 dissolve into the fog. -->
  <g>
    <!-- resolved: solid, cool, fully drawn -->
    <g fill="#F0F0F0">
      <rect class="settled" style="animation-delay:.05s" x="120" y="140" width="46" height="46"/>
      <rect class="settled" style="animation-delay:.09s" x="120" y="212" width="46" height="46"/>
      <rect class="settled" style="animation-delay:.13s" x="120" y="284" width="46" height="46"/>
      <rect class="settled" style="animation-delay:.17s" x="120" y="356" width="46" height="46"/>
      <rect class="settled" style="animation-delay:.21s" x="192" y="176" width="46" height="46"/>
      <rect class="settled" style="animation-delay:.25s" x="192" y="248" width="46" height="46"/>
      <rect class="settled" style="animation-delay:.29s" x="192" y="320" width="46" height="46"/>
      <rect class="settled" style="animation-delay:.33s" x="264" y="140" width="46" height="46"/>
      <rect class="settled" style="animation-delay:.37s" x="264" y="212" width="46" height="46"/>
      <rect class="settled" style="animation-delay:.41s" x="264" y="284" width="46" height="46"/>
      <rect class="settled" style="animation-delay:.45s" x="336" y="176" width="46" height="46"/>
      <rect class="settled" style="animation-delay:.49s" x="336" y="248" width="46" height="46"/>
      <rect class="settled" style="animation-delay:.53s" x="336" y="320" width="46" height="46"/>
      <rect class="settled" style="animation-delay:.57s" x="336" y="392" width="46" height="46"/>
    </g>

    <!-- the frontier: the one column that is takeable right now -->
    <g class="sweep">
      <g fill="url(#brandGlow)">
        <rect class="edge" style="animation-delay:.62s" x="430" y="140" width="46" height="46"/>
        <rect class="edge" style="animation-delay:.66s" x="430" y="212" width="46" height="46"/>
        <rect class="edge" style="animation-delay:.70s" x="430" y="284" width="46" height="46"/>
        <rect class="edge" style="animation-delay:.74s" x="430" y="356" width="46" height="46"/>
      </g>
    </g>

    <!-- blocked, then fog: the same lattice, losing definition -->
    <g fill="#F0F0F0">
      <rect class="fog" style="animation-delay:.78s" opacity=".55" x="540" y="176" width="46" height="46"/>
      <rect class="fog" style="animation-delay:.82s" x="540" y="248" width="46" height="46"/>
      <rect class="fog" style="animation-delay:.86s" x="540" y="320" width="46" height="46"/>
      <rect class="fog" style="animation-delay:.90s" x="612" y="140" width="46" height="46"/>
      <rect class="fog" style="animation-delay:.94s" x="612" y="212" width="46" height="46"/>
      <rect class="fog" style="animation-delay:.98s" x="612" y="284" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.02s" x="612" y="356" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.06s" x="684" y="176" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.10s" x="684" y="248" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.14s" x="684" y="320" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.18s" x="756" y="140" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.22s" x="756" y="212" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.26s" x="756" y="284" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.30s" x="828" y="176" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.34s" x="828" y="248" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.38s" x="828" y="320" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.42s" x="900" y="140" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.46s" x="900" y="212" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.50s" x="900" y="284" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.54s" x="900" y="356" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.58s" x="972" y="176" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.62s" x="972" y="248" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.66s" x="1044" y="212" width="46" height="46"/>
      <rect class="fog" style="animation-delay:1.70s" x="1044" y="284" width="46" height="46"/>
    </g>
  </g>

  <!-- The fog itself. Drawn over the right half so the lattice loses the
       argument rather than simply stopping. -->
  <rect x="500" y="0" width="700" height="630" fill="url(#fogWash)" pointer-events="none"/>
</svg>
