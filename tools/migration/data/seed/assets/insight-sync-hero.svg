<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A dark field of thin frame outlines; one pulses brand red, a seam runs down the middle, and four small ticket squares light up in sequence on the right.">
  <!--
    Insight hero, "The design team moved the file. The repo filed the tickets."

    The post's spine drawn once: the tracked frames as a quiet grid on the
    left, the one that moved pulsing brand red, the report as a dashed seam,
    and the tickets arriving on the right in order. Squares because the design
    has square corners everywhere; the red arrives as a gradient because a
    flat red area is almost always wrong in this design (see tokens/color.css).

    Self-contained on purpose. An SVG referenced by <img> cannot see the page
    stylesheet and never runs script, so the palette and the motion live here.
    Token values are the warmed 2026-08 set this post describes: ink #0A0A0B,
    bone #F1F0EC, brand #EB1000, fg-muted #76746F.

    (No double hyphen anywhere in this file: XML forbids one inside a comment,
    and an SVG that fails to parse renders as a 0x0 broken image.)
  -->
  <style>
    @keyframes pulse {
      0%, 100% { stroke-opacity: 1; fill-opacity: 0.28; }
      50% { stroke-opacity: 0.45; fill-opacity: 0.08; }
    }
    @keyframes arrive {
      from { opacity: 0; transform: translateX(14px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes seam {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -36; }
    }
    .changed { animation: pulse 3.2s ease-in-out infinite; }
    .seam { animation: seam 6s linear infinite; }
    .t1 { animation: arrive 0.9s ease-out 0.4s both; }
    .t2 { animation: arrive 0.9s ease-out 1.0s both; }
    .t3 { animation: arrive 0.9s ease-out 1.6s both; }
    .t4 { animation: arrive 0.9s ease-out 2.2s both; }
    @media (prefers-reduced-motion: reduce) {
      .changed { animation: none; stroke-opacity: 1; fill-opacity: 0.28; }
      .seam { animation: none; }
      .t1, .t2, .t3, .t4 { animation: none; opacity: 1; transform: none; }
    }
  </style>
  <defs>
    <linearGradient id="brandWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EB1000" stop-opacity="0.9" />
      <stop offset="1" stop-color="#EB1000" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0B" />

  <!-- the tracked frames: a quiet grid, drawn with the muted stroke -->
  <g fill="none" stroke="#3A3936" stroke-width="2">
    <rect x="120" y="103" width="136" height="100" />
    <rect x="288" y="103" width="136" height="100" />
    <rect x="456" y="103" width="136" height="100" />
    <rect x="120" y="265" width="136" height="100" />
    <rect x="456" y="265" width="136" height="100" />
    <rect x="120" y="427" width="136" height="100" />
    <rect x="288" y="427" width="136" height="100" />
    <rect x="456" y="427" width="136" height="100" />
  </g>

  <!-- the frame that moved -->
  <rect class="changed" x="288" y="265" width="136" height="100" fill="url(#brandWash)" stroke="#EB1000" stroke-width="2.5" />

  <!-- the report: the seam between detection and judgment -->
  <line class="seam" x1="708" y1="80" x2="708" y2="550" stroke="#76746F" stroke-width="2" stroke-dasharray="4 14" />

  <!-- the tickets, arriving in order -->
  <g fill="none" stroke="#F1F0EC" stroke-width="2">
    <g class="t1">
      <rect x="820" y="120" width="260" height="78" />
      <line x1="848" y1="159" x2="1000" y2="159" stroke="#76746F" />
      <line x1="848" y1="159" x2="884" y2="159" stroke="#EB1000" stroke-width="3" />
    </g>
    <g class="t2">
      <rect x="820" y="224" width="260" height="78" />
      <line x1="848" y1="263" x2="1000" y2="263" stroke="#76746F" />
      <line x1="848" y1="263" x2="884" y2="263" stroke="#EB1000" stroke-width="3" />
    </g>
    <g class="t3">
      <rect x="820" y="328" width="260" height="78" />
      <line x1="848" y1="367" x2="1000" y2="367" stroke="#76746F" />
      <line x1="848" y1="367" x2="884" y2="367" stroke="#EB1000" stroke-width="3" />
    </g>
    <g class="t4">
      <rect x="820" y="432" width="260" height="78" />
      <line x1="848" y1="471" x2="1000" y2="471" stroke="#76746F" />
      <line x1="848" y1="471" x2="884" y2="471" stroke="#EB1000" stroke-width="3" />
    </g>
  </g>
</svg>
