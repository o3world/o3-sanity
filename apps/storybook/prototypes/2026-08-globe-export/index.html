<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O3 Globe — official exports</title>
<style>
  html,body { height:100%; margin:0; background:#030303; color:#F4F4F6;
    font-family: Figtree, system-ui, -apple-system, sans-serif; }
  .grid { display:grid; grid-template-columns:1fr 1fr; height:100%; }
  .cell { position:relative; display:flex; align-items:center; justify-content:center; }
  .cell + .cell { border-left:1px solid rgba(255,255,255,.12); }
  iframe { width:100%; height:100%; border:0; }
  .tag { position:absolute; top:12px; left:16px; font-size:12px; letter-spacing:.04em;
    text-transform:uppercase; opacity:.6; pointer-events:none; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><span class="tag">Red — hero settings</span><iframe src="./globe-red/index.html" title="Red globe"></iframe></div>
    <div class="cell"><span class="tag">Grey — background settings</span><iframe src="./globe-grey/index.html" title="Grey globe"></iframe></div>
  </div>
</body>
</html>
